version: "1"
kind: miner
id: 8262601
slug: tempest-storm-intelligence
protocol: generic
name: Tempest Storm Intelligence
description: Deterministic global storm alerts with transparent thresholds, hazard timing, confidence, and source provenance for autonomous agents.
base_url: https://tempest-telegraph-miner.onrender.com
docs:
  website: https://tempest-telegraph-miner.onrender.com/health
  repository: https://github.com/yeziR4/tempest-telegraph-miner
auth:
  type: none
endpoints:
  - path: /v1/storm-alert
    external_path: /v1/storm-alert
    method: POST
    description: Assess storm hazards from a natural-language question, place, or coordinates over the next 1 to 384 hours.
input_schema:
  type: object
  properties:
    location: { type: string }
    query: { type: string, description: "Original natural-language storm question, including location and time window." }
    q: { type: string, description: "Alias for query." }
    question: { type: string, description: "Alias for query." }
    latitude: { type: number, minimum: -90, maximum: 90 }
    longitude: { type: number, minimum: -180, maximum: 180 }
    hours: { type: integer, minimum: 1, maximum: 384 }
    forecast_hours: { type: integer, minimum: 1, maximum: 384 }
    days: { type: integer, minimum: 1, maximum: 16 }
    forecast_days: { type: integer, minimum: 1, maximum: 16 }
  anyOf:
    - required: [location]
    - required: [latitude, longitude]
    - required: [query]
    - required: [q]
    - required: [question]
output_schema:
  type: object
  required: [intent, label, level, breach, confidence, risk, summary, hazards, source]
  properties:
    intent: { type: string }
    label: { type: string }
    level: { type: string, enum: [none, advisory, warning, emergency] }
    verdict: { type: string, enum: [none, low, moderate, high, severe] }
    breach: { type: boolean }
    storm_expected: { type: boolean }
    confidence: { type: number, minimum: 0, maximum: 1 }
    risk: { type: number, minimum: 0, maximum: 1 }
    risk_score: { type: number, minimum: 0, maximum: 1 }
    summary: { type: string }
    reason: { type: string }
    hazards: { type: array, items: { type: object } }
    location: { type: string }
    country: { type: string }
    window_hours: { type: integer }
    start_time: { type: [string, "null"] }
    end_time: { type: [string, "null"] }
    peak_at: { type: [string, "null"] }
    max_wind_gust_kmh: { type: number }
    max_wind_speed_kmh: { type: number }
    wind_direction: { type: [string, "null"] }
    max_precipitation_mm: { type: number }
    total_precipitation_mm: { type: number }
    thunderstorm: { type: boolean }
    source: { type: string }
    request_defaulted: { type: boolean }
semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: label
    reason_field: reason
  supported_intents:
    - STORM_ALERT
on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    integers:
      - index: 0
        name: risk_x10000
        source_path: risk
        multiplier: 10000
    bools:
      - index: 0
        name: breach
        source_path: breach


