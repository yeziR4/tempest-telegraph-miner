version: "1"
kind: miner
id: 8262601
slug: tempest-storm-intelligence
protocol: generic
name: Tempest Storm Intelligence
description: Deterministic global storm alerts with transparent thresholds, hazard timing, confidence, and source provenance for autonomous agents.
base_url: https://tempest-telegraph-miner.onrender.com
docs:
  website: https://tempest-telegraph-miner.onrender.com/health
  repository: https://github.com/yeziR4/tempest-telegraph-miner
auth:
  type: none
endpoints:
  - path: /v1/storm-alert
    external_path: /v1/storm-alert
    method: POST
    description: Assess storm hazards for a place or coordinates over the next 1 to 72 hours.
input_schema:
  type: object
  properties:
    location: { type: string }
    latitude: { type: number, minimum: -90, maximum: 90 }
    longitude: { type: number, minimum: -180, maximum: 180 }
    hours: { type: integer, minimum: 1, maximum: 72 }
  anyOf:
    - required: [location]
    - required: [latitude, longitude]
output_schema:
  type: object
  required: [intent, label, level, breach, confidence, risk, summary, hazards, source]
  properties:
    intent: { type: string }
    label: { type: string }
    level: { type: string, enum: [none, advisory, warning, emergency] }
    breach: { type: boolean }
    confidence: { type: number, minimum: 0, maximum: 1 }
    risk: { type: number, minimum: 0, maximum: 1 }
    summary: { type: string }
    reason: { type: string }
    hazards: { type: array, items: { type: object } }
    source: { type: string }
semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: label
    reason_field: reason
  supported_intents:
    - STORM_ALERT
on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    integers:
      - index: 0
        name: risk_x10000
        source_path: risk
        multiplier: 10000
    bools:
      - index: 0
        name: breach
        source_path: breach

